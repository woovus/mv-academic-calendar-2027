<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf"><title>Maldives Academic Calendar 2027</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--fg:#14233a;--mut:#5b6b80;--line:#d9e1ec;--ac:#1f5fbf}
@media(prefers-color-scheme:dark){:root{--bg:#0b1422;--card:#14233a;--fg:#eaf0f8;--mut:#9fb0c6;--line:#27384f;--ac:#4b8ef0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.45rem;line-height:1.2;margin:0 0 6px}
.sub{color:var(--mut);font-size:.95rem;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;min-height:52px;padding:14px;border-radius:14px;background:var(--ac);color:#fff;text-align:center;text-decoration:none;font-weight:600;font-size:1.05rem;margin-top:10px}
.btn.alt{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.k{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.k:first-of-type{border-top:0}.k span{flex:1}.k small{display:block;color:var(--mut);font-size:.82rem}
.k a{min-height:44px;min-width:76px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ac);border-radius:12px;color:var(--ac);text-decoration:none;font-weight:600;font-size:.95rem}
details summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}
.note{color:var(--mut);font-size:.85rem;margin-top:10px}
</style></head><body><main>
<h1>Maldives Academic Calendar 2027</h1>
<p class="sub">Terms, exams, school breaks and public holidays. Updates itself when the Ministry changes dates. Tentative version: 1 Oct 2026.</p>
<div class="card">
<b id="dev">Add to your calendar</b>
<a class="btn" id="main" href="#">Add all events</a>
<a class="btn alt" id="dl" href="calendar.ics" download>Download file instead</a>
<p class="note" id="hint"></p>
</div>
<div class="card"><details><summary>Add only some types</summary><div id="rows"></div></details></div>
<script>
const C=[["term","🟦 School Term","Term start/end, reporting days"],["break","🟩 School Break","Mid-breaks, term holidays"],["exam","🟥 Exam","Mocks, term exams"],["public","🟨 Public Holiday","Eid, Ramadan, national days"],["other","🟪 School Activity","PD days, transfers, camps"]];
const ua=navigator.userAgent,android=/Android/i.test(ua),apple=/iPhone|iPad|Macintosh/i.test(ua);
const base=new URL(".",location.href).href;
const w=f=>(base+f+".ics").replace(/^https?:/,"webcal:");
const g=f=>"https://calendar.google.com/calendar/r?cid="+encodeURIComponent(w(f));
const add=f=>android?g(f):w(f);
document.getElementById("dev").textContent=android?"Android detected":apple?"iPhone / Mac detected":"Add to your calendar";
document.getElementById("hint").textContent=android?"Opens Google Calendar. If asked, choose the desktop site and tap Add. Or use the download button and open the file with Google Calendar (one-time copy, no auto-updates).":"Tap Subscribe when your calendar asks. If nothing happens, use the download button.";
const m=document.getElementById("main");m.href=add("calendar");if(!android&&!apple)m.href=w("calendar");
document.getElementById("rows").innerHTML=C.map(([f,t,d])=>`<div class="k"><span>${t}<small>${d}</small></span><a href="${add(f)}"${android?' target="_blank" rel="noopener"':''}>Add</a></div>`).join("");
</script></main></body></html>
